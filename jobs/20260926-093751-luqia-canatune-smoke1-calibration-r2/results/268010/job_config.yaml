project:
  name: canatune-exp
  mode: disaggregated_inference
  work_dir_root: /data/users/chjing/vllm_job_work
  broker_root: /path/to/job_broker
slurm:
  partition: long
  time_limit: '16:00:00'
  nodes: 2
  cpus_per_gpu: 8
  exclusive: true
runtime:
  python: /data/users/chjing/miniforge3/envs/cuda-env/bin/python
  vllm_version: 0.15.1
  offline: true
  environment:
    HF_HUB_OFFLINE: '1'
    TRANSFORMERS_OFFLINE: '1'
    NCCL_IB_DISABLE: '1'
    NCCL_SOCKET_IFNAME: ^lo
    NCCL_DEBUG: INFO
model:
  name: mistralai/Mistral-7B-v0.1
  snapshot_root: /path/to/model/snapshots
  path_override_env: MODEL_OVERRIDE
  max_model_len: 4096
topology:
  ip_resolution:
    method: slurm_hostname_I_first_address
    hardcode_ip: false
  prefill_nodegroup:
    node: neptune
    gpu_type: NVIDIA L40S
    endpoint_prefix: P
    gpu_ids:
    - 0
    - 1
    http_port_base: 8100
    kv_port_base: 14579
    high_frequency_mhz: 2520
    memory_frequency_mhz: null
    gpu_uuids:
    - GPU-35fd1bf9-5849-1263-ccc4-a5ccc837400f
    - GPU-a59fb458-a10d-49e3-c7e2-39daba72a66d
  decode_nodegroup:
    node: ganymede
    gpu_type: NVIDIA L4
    endpoint_prefix: D
    gpu_ids:
    - 1
    - 2
    http_port_base: 8200
    kv_port_base: 14579
    high_frequency_mhz: 1500
    memory_frequency_mhz: null
    gpu_memory_utilization: 0.82
    gpu_uuids:
    - GPU-1a75a85d-1f07-6519-507b-f1ff9def0ab9
    - GPU-4c457bed-02f9-0e41-a2aa-223bc07a6d30
  endpoints:
    P0:
      role: prefill
      gpu_id: 0
      http_port: 8100
      kv_port: 14579
    P1:
      role: prefill
      gpu_id: 1
      http_port: 8101
      kv_port: 14580
    D0:
      role: decode
      gpu_id: 1
      http_port: 8200
      kv_port: 14579
    D1:
      role: decode
      gpu_id: 2
      http_port: 8201
      kv_port: 14580
kv_transfer:
  connector: P2pNcclConnector
  prefill_role: kv_producer
  decode_role: kv_consumer
  prefill_send_type: PUT_ASYNC
  disable_prefix_cache: true
  disable_chunked_prefill: true
proxy:
  enabled: true
  host: 127.0.0.1
  port: 18010
  endpoint: /v1/completions
  diagnostics_log: ${raw_root}/launcher/proxy_diagnostics.jsonl
routing:
  policy: cantune
  canary_pair:
  - P0
  - D0
  production_pairs:
  - - P1
    - D1
  allow_production_cross_pairs: false
router:
  theta: 0.1
  max_wait_ms: 100
  retry_period_ms: 20
  snapshot_max_age_s: 1.0
  d_busy_min_running: 1
  chars_per_token: 4
telemetry:
  enabled: true
  period_s: 0.25
controller:
  period_s: 1.0
  load_window_s: 10.0
  t_down_s: 30
  wake_load_fraction: 0.85
  park_load_fraction: 0.7
  min_active_groups: 1
  stagger_s: 2.0
  energy_log_period_s: 5
risk:
  n_await_edges:
  - 0
  - 1
  - 2
  - 3
  - 5
  prompt_token_edges:
  - 128
  - 512
  - 1024
  - 2048
  min_samples: 20
  path: null
  seed: {}
clock_control:
  enabled: true
  agent_port: 9300
  agents:
    prefill: null
    decode: null
  min_mhz:
    prefill: 600
    decode: 300
canary:
  tier_table_path: null
  default_lengths:
  - - 128
    - 64
  - - 512
    - 64
  - - 1024
    - 64
  - - 2048
    - 64
  length_min_samples: 50
  period_s: 1.0
  quiet_s: 60
  others_load_max: 0.7
  min_interval_s: 600
  max_duty: 0.1
  periodic_s: 1800
  length_shift: 0.3
  drift_min_samples: 200
  drain_timeout_s: 30
  locator:
    eps: 0.02
    ttft_target_fraction: 0.8
    target_load_fraction: 0.8
    low_load_fraction: 0.3
    fill_load_fractions:
    - 0.3
    - 0.5
    - 0.8
    - 1.0
    window_s: 20
    idle_window_s: 5
    coarse_points: 5
    refine_steps: 3
    limited_fraction_max: 0.3
    decode_probe_concurrency: 16
    decode_start_concurrency: 8
    decode_kv_limit: 0.9
  probe:
    settle_s: 2.0
    sample_period_s: 0.25
    prefill_min_mhz: 600
    decode_min_mhz: 300
cache:
  root: ${work_dir}
  hf_home: ${work_dir}/huggingface
  hf_hub_cache: ${work_dir}/huggingface/hub
  torch_home: ${work_dir}/torch-cache
  triton_cache: ${work_dir}/triton-cache
  cuda_cache: ${work_dir}/cuda-cache
  vllm_cache: ${work_dir}/vllm-cache
  flashinfer_workspace: ${work_dir}/flashinfer
  tmp_dir: ${work_dir}/tmp
artifacts:
  raw_root: ${work_dir}/raw
  result_root: ${broker_job_dir}/results/${slurm_job_id}
  server_logs: ${raw_root}/launcher
  frequency_table: ${raw_root}/frequency_table.json
  route_control: ${raw_root}/production_route_control.json
experiment:
  smoke_gate:
    enabled: true
    endpoint_pair:
    - P0
    - D0
    required_before_formal_measurement: true
  slo:
    ttft_ms: 500
    tpot_ms: 200
  workload:
    request_timeout_s: 900
    max_concurrency: 1
    request_interval_s: 5
container:
  enabled: false
  runtime: apptainer
  image: /path/to/vllm.sif
  use_nvidia_runtime: true
  host_network: true
  mounts:
  - ${work_dir}:${work_dir}
  - ${model_path}:${model_path}:ro
  - ${source_root}:/workspace
